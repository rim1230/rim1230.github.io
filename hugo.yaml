baseURL: "https://rim1230.github.io/"
theme: "PaperMod"

defaultContentLanguage: "ja"
defaultContentLanguageInSubdir: false

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

pagination:
  pagerSize: 10

minify:
  disableXML: true
  minifyOutput: true

outputs:
  home:
    - HTML
    - RSS
    - JSON

params:
  env: production
  defaultTheme: auto
  displayFullLangName: true
  ShowReadingTime: true
  ShowBreadCrumbs: true
  ShowPostNavLinks: true
  ShowCodeCopyButtons: true
  ShowToc: true
  TocOpen: false

  socialIcons:
    - name: github
      url: "https://github.com/rim1230"
    - name: x
      url: "https://x.com/ktkyng1"
    - name: linkedin
      url: "https://www.linkedin.com/in/ktakayanagi/"
    - name: email
      url: "mailto:takayanagi.keitaro.54h@st.kyoto-u.ac.jp"

  fuseOpts:
    keys: ["title", "permalink", "summary", "content"]

languages:
  ja:
    label: "日本語"
    locale: "ja-jp"
    weight: 1
    title: "高柳 慶太郎"
    params:
      description: "高柳慶太郎の個人サイト"
      homeInfoParams:
        Title: "高柳 慶太郎 / Keitaro Takayanagi"
        Content: >
          京都大学 首藤研究室 修士課程。
          ソーシャルネットワーク分析と計算社会科学を研究しています。
    menus:
      main:
        - name: About
          pageRef: /about
          weight: 10
        - name: Posts
          pageRef: /posts
          weight: 20
        - name: Search
          pageRef: /search
          weight: 30

  en:
    label: "English"
    locale: "en-us"
    weight: 2
    title: "Keitaro Takayanagi"
    params:
      description: "Keitaro Takayanagi's personal website"
      homeInfoParams:
        Title: "Keitaro Takayanagi / 高柳 慶太郎"
        Content: >
          Master's student at Shudo Lab, Kyoto University.
          Working on social network analysis and computational social science.
    menus:
      main:
        - name: About
          pageRef: /about
          weight: 10
        - name: Posts
          pageRef: /posts
          weight: 20
        - name: Search
          pageRef: /search
          weight: 30
